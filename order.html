<main>
  <section class="section">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a> / <span>Оформление заказа</span>
      </nav>
      <h1 class="mb-md">Оформление заказа</h1>
      <p class="text-muted mb-lg">Заполните форму — мы свяжемся с вами в течение 15 минут.</p>

      <form class="form" action="#" method="post">
        <div class="form__group">
          <label class="form__label form__label--required" for="order-name">Имя</label>
          <input class="form__input" type="text" id="order-name" name="name" placeholder="Иван Иванов" required>
        </div>

        <div class="form__group">
          <label class="form__label form__label--required" for="order-email">Email</label>
          <input class="form__input" type="email" id="order-email" name="email" placeholder="ivan@example.com" required>
        </div>

        <div class="form__group">
          <label class="form__label form__label--required" for="order-phone">Телефон</label>
          <input class="form__input" type="tel" id="order-phone" name="phone" placeholder="+7 (___) ___-__-__" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="order-product">Товар</label>
          <select class="form__select" id="order-product" name="product">
            <option value="">— Выберите товар —</option>
            <option>Смартфон Galaxy A55</option>
            <option>Смартфон iPhone 15</option>
            <option>Ноутбук MacBook Air M3</option>
            <option>Наушники AirPods Pro 2</option>
            <option>Другое</option>
          </select>
        </div>

        <div class="form__group">
          <label class="form__label" for="order-comment">Комментарий</label>
          <textarea class="form__textarea" id="order-comment" name="comment" placeholder="Уточните детали заказа"></textarea>
        </div>

        <div class="form__checkbox">
          <input type="checkbox" id="order-agree" name="agree" required>
          <label for="order-agree">Согласен на обработку персональных данных</label>
        </div>

        <div class="form__actions">
          <button type="submit" class="button button--primary button--lg">Отправить заявку</button>
          <button type="reset" class="button button--ghost">Очистить</button>
        </div>
      </form>
    </div>
  </section>
</main>
